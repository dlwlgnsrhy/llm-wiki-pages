name: Deploy curated public Wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public artifact
        uses: actions/checkout@v6
      - name: Inject deployment revision
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          export short_sha
          find public -type f \( -name "*.html" -o -name "*.json" -o -name "*.js" \) -exec perl -pi -e 's/__PUBLIC_DEPLOY_SHA__/$ENV{GITHUB_SHA}/g; s/__PUBLIC_DEPLOY_SHORT_SHA__/$ENV{short_sha}/g' {} +
          if grep -R -n "__PUBLIC_DEPLOY_" public; then
            echo "Deployment revision placeholder remains"
            exit 1
          fi
      - name: Audit public boundary
        run: |
          if find public -type l -print -quit | grep -q .; then
            echo "Symlinks are not allowed in the public artifact"
            exit 1
          fi
          if grep -R -n -E 'raw/|Investor/|Life/|Departments/|/Users/|/private/|\.claude' public; then
            echo "Private path detected in public artifact"
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
